version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["./qdrant_data:/qdrant/storage"]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: smart_gallery
    ports: ["3306:3306"]
    volumes: ["./mysql_data:/var/lib/mysql"]
