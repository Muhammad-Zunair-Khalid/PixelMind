<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PixelMind</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="brand brand-center">
      <img src="assets/logo.svg" alt="" class="brand-logo" width="72" height="72" />
      <div class="brand-text">
        <span class="brand-name">PixelMind</span>
        <span class="brand-tagline">AI-Powered Photo Intelligence</span>
      </div>
    </div>

    <h2>Welcome back</h2>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required />

      <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      <p id="error" class="error" role="alert"></p>
    </form>

    <p class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>

  <script>
    const API_BASE = localStorage.getItem("apiBaseUrl") || "http://127.0.0.1:8000";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("submitBtn");
      errorEl.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.detail || "Login failed";
          return;
        }

        localStorage.setItem("token", data.access_token);
        window.location.href = "gallery.html";
      } catch (error) {
        errorEl.textContent = "Unable to connect to server";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>

</html>
